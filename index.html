<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boyovut tuman 1-son Texnikum</title>
  
  <!-- Manifest ulanishi -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <style>
    :root { background: #f3f4f6; color: #1f2937; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { padding: 20px; display: flex; justify-content: center; }
    .app { background: #ffffff; padding: 24px; border-radius: 12px; max-width: 500px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { font-size: 20px; margin-bottom: 16px; text-align: center; color: #2563eb; font-weight: bold; line-height: 1.3; }
    
    .install-btn {
      width: 100%;
      padding: 12px;
      background: #8b5cf6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 18px;
      cursor: pointer;
      display: none; /* Odatiy holda yashirin */
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; }
    .radio-group { display: flex; gap: 16px; margin: 10px 0; }
    .radio-label { display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; }
    .photo-box { width: 100%; height: 220px; background: #e5e7eb; border: 2px dashed #9ca3af; border-radius: 8px; margin: 15px 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .photo-preview { width: 100%; height: 100%; object-fit: cover; display: none; }
    .file-input { display: none; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .status-badge { font-size: 13px; padding: 8px; border-radius: 4px; background: #e5e7eb; text-align: center; margin-top: 5px; font-weight: bold; }
    .status-badge.error { background: #fecdd3; color: #9f1239; }
    .status-badge.success { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>

<div class="app">
  <h1>Boyovut tuman 1-son Texnikum</h1>
  
  <button type="button" id="btn-install" class="install-btn" onclick="installPWA()">📲 Ilovani telefonga o'rnatish</button>

  <div class="form-group">
    <label>Bo'limni tanlang</label>
    <select id="emp-dept" onchange="updateEmployeeList()">
      <option value="">Tanlang...</option>
      <option value="Ma'muriyat">1. Ma'muriyat</option>
      <option value="O'qituvchilar">2. O'qituvchilar</option>
      <option value="ICHTU">3. ICHTU</option>
    </select>
  </div>

  <div class="form-group">
    <label>Xodim F.I.Sh.</label>
    <select id="emp-name" onchange="checkForm()" disabled>
      <option value="">Xodimni tanlang...</option>
    </select>
  </div>

  <div class="form-group">
    <label>Harakat turi</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="status" value="🟢 Keldi" checked> Keldi</label>
      <label class="radio-label"><input type="radio" name="status" value="🔴 Ketdi"> Ketdi</label>
    </div>
  </div>

  <div class="form-group">
    <label>Face Control (Rasmga tushish)</label>
    <div class="photo-box">
      <span id="photo-placeholder">Rasm yuklanmagan</span>
      <img id="preview" class="photo-preview" alt="Preview">
    </div>
    <input type="file" accept="image/*" capture="user" id="camera-file" class="file-input" onchange="handlePhoto(this)">
    <button type="button" class="btn-blue" id="btn-camera-trigger" onclick="openCamera()" disabled>Kamerani ochish</button>
    <div class="status-badge" id="face-status">Kutilmoqda...</div>
  </div>

  <div class="form-group">
    <label>GPS Geolokatsiya</label>
    <button type="button" class="btn-blue" onclick="verifyGPS()">GPS manzilni aniqlash</button>
    <div class="status-badge" id="geo-status">Kutilmoqda...</div>
  </div>

  <button type="button" class="btn-green" id="btn-submit" onclick="sendDataToTelegram()" disabled>Tasdiqlash va Saqlash</button>
</div>

<script>
  const employeesByDept = {
    "Ma'muriyat": ["Rayimov.A", "Shodiyev.D", "Usmonov.R", "Razzoqberdiyev.Q", "Boltayev.K", "Berdinazarova.D", "Mamanazarov.R", "Mamatqulova.Yu", "Mavlonov.Yu", "Ollonazarov.U", "Keldibekov.F", "Xolmuhammedov.A", "Usmonova.N", "Xo`janov.N", "Xolboyeva.Sh", "Xolboyeva.F", "Sharipov.O", "Tursunov.A", "Latipov.A"],
    "O'qituvchilar": ["Abdujalilov.A", "Abdurahmonova.A", "Abdurahmonova.S", "Abdurahmonova.N", "Abduqahhorov.O", "Abdurazzoqov.E", "Abdusalomova.O", "Ahmadqulova.R", "Allayorova.M", "G`aniyeva.Z", "Hamidova.M", "Hamroqulov.Sh", "Igamberdiyev.A", "Jalilova.N", "Karimov.A", "Ko`chmurodov.M", "Latipova.O", "Mirzayeva.Sh", "Muhammadqulov.J", "Normamatov.L", "Qoraboyeva.Sh", "Rahimov.J", "Sangilov.S", "Sheraliyev.Sh", "Soyupov.F", "Usmonova.Z", "Xamidov.S", "Xaydarova.D", "Yo`ldoshev.J"],
    "ICHTU": ["Abdujalilov.A", "Berdaliyev.B", "Bobomurodov.O", "G`aybullayev.A", "Mamanazarov.A", "Mamanazarov.Sh", "Murodov.A", "Nasriddinov.A", "O`razaliyev.A", "Odilov.S", "Rayimjonov.A", "Shukurov.A", "Fozilboyev.N", "Jumanova.Z", "To`ychiboyev.B", "Tojiboyev.R", "Turdiqulov.U"]
  };

  let faceVerified = false; 
  let geoVerified = false; 
  let coordsText = ""; 
  let rawFileBlob = null;
  let deferredPrompt = null;

  const TECH_LAT = 40.282981;
  const TECH_LON = 69.033522;
  const MAX_DISTANCE_METERS = 200;

  // --- ILOVA O'RNATISH TUGMASI LOGIKASI ---
  const installBtn = document.getElementById('btn-install');

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  const isInstalledInStorage = localStorage.getItem('appInstalled') === 'true';

  if (!isStandalone && !isInstalledInStorage) {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
  }

  function installPWA() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          localStorage.setItem('appInstalled', 'true');
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      });
    } else {
      const isAndroid = /Android/i.test(navigator.userAgent);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isAndroid) {
        alert("Ilovani o'rnatish uchun:\n1. Brauzerning yuqori burchagidagi 3 ta nuqtani (⋮) bosing.\n2. 'Ekran bo'limiga qo'shish' (Добавить на гл. экран) bosing.");
      } else if (isIOS) {
        alert("Ilovani o'rnatish uchun:\n1. Pastdagi 'Ulashish' (Share ⎋) tugmasini bosing.\n2. 'Ekran bo'limiga qo'shish' (Add to Home Screen) bosing.");
      }
      localStorage.setItem('appInstalled', 'true');
      installBtn.style.display = 'none';
    }
  }

  window.addEventListener('appinstalled', () => {
    localStorage.setItem('appInstalled', 'true');
    installBtn.style.display = 'none';
  });

  // --- MASofani HISOBLASH ---
  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const phi1 = lat1 * Math.PI / 180;
    const phi2 = lat2 * Math.PI / 180;
    const deltaPhi = (lat2 - lat1) * Math.PI / 180;
    const deltaLambda = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) + Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }

  function updateEmployeeList() {
    const deptSelect = document.getElementById('emp-dept');
    const dept = deptSelect.value;
    const nameSelect = document.getElementById('emp-name');
    
    nameSelect.innerHTML = '<option value="">Xodimni tanlang...</option>';
    
    if (dept && employeesByDept[dept]) {
      nameSelect.disabled = false;
      employeesByDept[dept].forEach(n => {
        let op = document.createElement('option'); 
        op.value = n; 
        op.textContent = n; 
        nameSelect.appendChild(op);
      });
    } else { 
      nameSelect.disabled = true; 
    }
    checkForm();
  }

  function checkForm() {
    const name = document.getElementById('emp-name').value;
    const dept = document.getElementById('emp-dept').value;
    document.getElementById('btn-camera-trigger').disabled = !(name && dept);
    updateSubmitButton();
  }

  function openCamera() { document.getElementById('camera-file').click(); }

  function handlePhoto(input) {
    if (input.files && input.files[0]) {
      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const MAX_SIZE = 800;

          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => {
            rawFileBlob = blob;
            document.getElementById('preview').src = canvas.toDataURL('image/jpeg', 0.6);
            document.getElementById('preview').style.display = 'block';
            document.getElementById('photo-placeholder').style.display = 'none';
            faceVerified = true;
            
            const statusEl = document.getElementById('face-status');
            statusEl.textContent = "🟢 Rasm yuklandi!";
            statusEl.className = "status-badge success";
            updateSubmitButton();
          }, 'image/jpeg', 0.6);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  // --- APK UCHUN MAXSUS VA ANIQ GPS TEKSHIRUVI ---
  function verifyGPS() {
    const statusEl = document.getElementById('geo-status');
    statusEl.textContent = "Sputniklar qidirilmoqda (GPS)...";
    statusEl.className = "status-badge";

    if (!navigator.geolocation) {
      statusEl.textContent = "❌ Telefoningiz GPS-ni qo'llab-quvvatlamaydi!";
      statusEl.className = "status-badge error";
      geoVerified = false;
      updateSubmitButton();
      return;
    }

    // Android APK uchun optimal vaqt va aniqlik sozlamalari
    const options = {
      enableHighAccuracy: true, 
      timeout: 25000,          // 25 sekund kutish (APK uchun muhim)
      maximumAge: 0            
    };

    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const dist = getDistanceMeters(lat, lon, TECH_LAT, TECH_LON);
        coordsText = `${lat},${lon}`;

        if (dist <= MAX_DISTANCE_METERS) {
          geoVerified = true;
          statusEl.textContent = `🟢 Hududdasiz (${Math.round(dist)}m)`;
          statusEl.className = "status-badge success";
        } else {
          geoVerified = false;
          statusEl.textContent = `❌ Hududdan tashqaridasiz! Masofa: ${Math.round(dist)}m (200m gacha ruxsat)`;
          statusEl.className = "status-badge error";
        }
        updateSubmitButton();
      },
      err => {
        geoVerified = false;
        let errorMsg = "❌ GPS aniqlanmadi!";
        if (err.code === 1) {
          errorMsg = "❌ GPS ruxsati berilmagan! Ilova sozlamalaridan joylashuvga ruxsat bering.";
        } else if (err.code === 2) {
          errorMsg = "❌ GPS signali topilmadi. Ochiq havoga chiqing.";
        } else if (err.code === 3) {
          errorMsg = "❌ GPS vaqt tugadi. Qaytadan urinib ko'ring.";
        }
        statusEl.textContent = errorMsg;
        statusEl.className = "status-badge error";
        updateSubmitButton();
      },
      options
    );
  }

  function updateSubmitButton() {
    const name = document.getElementById('emp-name').value;
    const dept = document.getElementById('emp-dept').value;
    document.getElementById('btn-submit').disabled = !(name && dept && faceVerified && geoVerified);
  }

  function sendDataToTelegram() {
    const submitBtn = document.getElementById('btn-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = "Yuborilmoqda...";

    const BOT_TOKEN = "8683724093:AAGM5CF0sjJn21wAp2mbzJPM4GUuwx0RrRE";
    const CHAT_ID = "-1004469348647";

    const name = document.getElementById('emp-name').value;
    const dept = document.getElementById('emp-dept').value;
    const status = document.querySelector('input[name="status"]:checked').value;
    
    const messageText = `📊 <b>YANGI DAVOMAT HISOBOTI</b>\n\n` +
                        `👤 <b>Xodim:</b> ${name}\n` +
                        `📂 <b>Bo'lim:</b> ${dept}\n` +
                        `🔄 <b>Harakat:</b> ${status}\n` +
                        `📍 <b>Lokatsiya:</b> <a href="https://maps.google.com/?q=${coordsText}">Google Maps</a>\n` +
                        `🕒 <b>Vaqt:</b> ${new Date().toLocaleString('uz-UZ', {timeZone: 'Asia/Tashkent'})}`;

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("caption", messageText);
    formData.append("parse_mode", "HTML");

    let apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;

    if (rawFileBlob) {
      formData.append("photo", rawFileBlob, "face.jpg");
    } else {
      apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
      formData.append("text", messageText);
    }

    fetch(apiUrl, { method: "POST", body: formData })
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        alert("Ma'lumot Telegram botga muvaffaqiyatli yuborildi!");
        location.reload();
      } else {
        alert("Xatolik: " + (data.description || "Qayta urinib ko'ring"));
        submitBtn.disabled = false;
        submitBtn.textContent = "Tasdiqlash va Saqlash";
      }
    })
    .catch(err => {
      alert("Tarmoq xatosi. Internetni tekshiring.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Tasdiqlash va Saqlash";
    });
  }
</script>
</body>
</html>
